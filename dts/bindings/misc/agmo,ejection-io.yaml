# SPDX-License-Identifier: Apache-2.0

description: GPIO map for the AGMO 12-channel ejection controller

compatible: "agmo,ejection-io"

properties:
  output-gpios:
    type: phandle-array
    required: true
    description: Twelve isolated ejection output control GPIOs in channel order.

  input-gpios:
    type: phandle-array
    required: true
    description: Fourteen isolated digital input GPIOs in channel order.

  manual-selector-input:
    type: int
    required: true
    description: Zero-based input index selecting manual mode.

  manual-button-count:
    type: int
    required: true
    description: Number of leading inputs mapped one-to-one to outputs in manual mode.

  encoder-a-gpios:
    type: phandle-array
    required: true

  encoder-b-gpios:
    type: phandle-array
    required: true

  encoder-switch-gpios:
    type: phandle-array
    required: true
