[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dajilog-provisioner"
version = "0.1.0"
description = "Dajilog CAN commissioning and provisioning tool"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6>=6.5,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
dajilog-provision = "dajilog_provisioner.cli:main"
dajilog-provisioner = "dajilog_provisioner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
