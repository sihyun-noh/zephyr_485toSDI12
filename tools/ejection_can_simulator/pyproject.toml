[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ejection-can-simulator"
version = "0.1.0"
description = "12ch ejection controller simulator for Waveshare USB-CAN-A"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.5,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ejection-can-simulator = "ejection_can_simulator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
