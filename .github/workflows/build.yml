name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build Dajilog firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: example-application

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: example-application
          toolchains: arm-zephyr-eabi

      - name: Build dajilog_tech bring-up test
        working-directory: example-application
        run: >-
          west build -p always -b dajilog_tech app/dajilog_tech_test
          -d build-ci/dajilog_tech_test

      - name: Build RS-485 to SDI-12 bridge
        working-directory: example-application
        run: >-
          west build -p always -b dajilog_tech app/dajilog_485_to_sdi12
          -d build-ci/dajilog_485_to_sdi12
          -- -DEXTRA_CONF_FILE=profiles/sensor_default.conf

      - name: Build Dajilog scale
        working-directory: example-application
        run: >-
          west build -p always -b dajilog_tech app/dajilog_scale
          -d build-ci/dajilog_scale

      - name: Build AGMO TIC
        working-directory: example-application
        run: >-
          west build -p always -b agmo_tic app/agmo_tic
          -d build-ci/agmo_tic

      - name: Run custom library test
        working-directory: example-application
        run: west twister -T tests/lib/custom -v --inline-logs --integration

      - name: Upload firmware artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dajilog-firmware-${{ github.sha }}
          path: |
            example-application/build-ci/**/zephyr/zephyr.bin
            example-application/build-ci/**/zephyr/zephyr.hex
            example-application/build-ci/**/zephyr/zephyr.elf
          if-no-files-found: error
