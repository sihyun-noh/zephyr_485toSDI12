CONFIG_GPIO=y

CONFIG_DAJILOG_COMPONENT_ADS1232=y
CONFIG_DAJILOG_COMPONENT_CAN_BUS=y
CONFIG_DAJILOG_COMPONENT_EEPROM_STORE=y
CONFIG_DAJILOG_COMPONENT_DEVICE_PROFILE=y
CONFIG_DAJILOG_COMPONENT_DEVICE_INFO=y
CONFIG_DAJILOG_COMPONENT_DEVICE_PROVISIONING=y
CONFIG_DAJILOG_COMPONENT_OLED_DISPLAY=y
CONFIG_DAJILOG_OLED_SCAN_I2C_ON_INIT=n
CONFIG_DAJILOG_OLED_SCAN_PERIOD_MS=0

CONFIG_EEPROM=y
CONFIG_CRC=y
CONFIG_I2C=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=n
CONFIG_CAN_DEFAULT_BITRATE=500000

CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_PRODUCT="Dajilog Scale"
CONFIG_USB_DEVICE_PID=0x0005
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_DEVICE_SHELL=n
CONFIG_SHELL_PROMPT_UART="dajilog:~$ "
CONFIG_SHELL_STACK_SIZE=1024
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_ARGC_MAX=8
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_HEAP_MEM_POOL_SIZE=2048

# EEPROM is verified with USB CDC. Restore the latest valid A/B calibration
# record during normal startup; keep the destructive bring-up test disabled.
CONFIG_SCALE_LOAD_CALIBRATION_AT_BOOT=y

# ADS1232 is configured for 10 SPS; request each conversion at 100 ms.
CONFIG_SCALE_SAMPLE_PERIOD_MS=100

# Publish the latest one-second moving-average result five times per second.
CONFIG_SCALE_CAN_MEASUREMENT_PERIOD_MS=200

# Normal scale operation: enable filtering/calibration and CAN RX/TX.
CONFIG_SCALE_RAW_DIAGNOSTIC_MODE=n
CONFIG_SCALE_CAN_ENABLE=y

# Development identity used until manufacturing provisioning writes a
# persistent Device Profile into EEPROM.
CONFIG_SCALE_DEVICE_PROFILE_ALLOW_DEVELOPMENT=y
CONFIG_SCALE_DEVICE_NODE_ID=12
CONFIG_SCALE_DEVICE_SERIAL_NUMBER=100001
CONFIG_SCALE_DEVICE_HW_REVISION=1
CONFIG_SCALE_DEVICE_FW_MAJOR=0
CONFIG_SCALE_DEVICE_FW_MINOR=1
CONFIG_SCALE_DEVICE_FW_PATCH=0
CONFIG_SCALE_DEVICE_FW_BUILD=1
