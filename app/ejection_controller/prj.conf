CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_CRC=y

CONFIG_DAJILOG_COMPONENT_ADS1232=n
CONFIG_DAJILOG_COMPONENT_OLED_DISPLAY=y
CONFIG_DAJILOG_OLED_SCAN_I2C_ON_INIT=y
CONFIG_DAJILOG_OLED_SCAN_PERIOD_MS=0
CONFIG_DAJILOG_COMPONENT_RS485_MODBUS=n
CONFIG_DAJILOG_COMPONENT_CAN_BUS=n
CONFIG_DAJILOG_COMPONENT_SBUS=n
CONFIG_DAJILOG_COMPONENT_SDI12_SLAVE=n
CONFIG_DAJILOG_COMPONENT_EEPROM_STORE=y
CONFIG_DAJILOG_EEPROM_BRINGUP_TEST=n
CONFIG_DAJILOG_COMPONENT_DEVICE_PROFILE=n
CONFIG_DAJILOG_COMPONENT_DEVICE_INFO=n
CONFIG_DAJILOG_COMPONENT_DEVICE_PROVISIONING=n

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=n
CONFIG_CAN_DEFAULT_BITRATE=250000

CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# Zephyr test VID for bring-up only; replace before a production release.
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PRODUCT="12ch-ejection-controller"
CONFIG_USB_DEVICE_PID=0x0005

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="ejection> "
CONFIG_SHELL_STACK_SIZE=1536
CONFIG_SHELL_CMD_BUFF_SIZE=96
CONFIG_SHELL_ARGC_MAX=6
CONFIG_THREAD_NAME=y
