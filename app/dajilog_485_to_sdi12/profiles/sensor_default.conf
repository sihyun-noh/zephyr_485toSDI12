# Default RS485 Modbus sensor profile for dajilog_485_to_sdi12.

CONFIG_BRIDGE_RS485_BAUDRATE=4800
CONFIG_BRIDGE_RS485_PARITY_NONE=y
CONFIG_BRIDGE_RS485_SLAVE_ADDR=1
# This sensor uses Modbus FC03 (Read Holding Registers).
CONFIG_BRIDGE_RS485_FUNCTION_CODE=3
CONFIG_BRIDGE_RS485_START_REG=0
CONFIG_BRIDGE_RS485_REG_COUNT=2
CONFIG_BRIDGE_RS485_POLL_PERIOD_MS=1000
CONFIG_BRIDGE_RS485_RESPONSE_TIMEOUT_MS=700
CONFIG_BRIDGE_RS485_TX_TURNAROUND_US=6000

CONFIG_BRIDGE_DO_STARTUP_TEST=n
CONFIG_BRIDGE_PB34_ONLY_TEST=n

CONFIG_BRIDGE_VALUE0_SCALE_DIVISOR=10
CONFIG_BRIDGE_VALUE1_SCALE_DIVISOR=10
CONFIG_BRIDGE_RESPONSE_FORMAT_X10=y

# Sensor register map: reg[0] = humidity x10 %RH, reg[1] = temperature x10 degC.
# SDI-12 response order is temperature first, then humidity.

CONFIG_BRIDGE_SDI12_ADDRESS="0"
CONFIG_BRIDGE_SDI12_VENDOR="DAJI"
CONFIG_BRIDGE_SDI12_MODEL="DAJI01"
CONFIG_BRIDGE_SDI12_VERSION="010"
CONFIG_BRIDGE_SDI12_SERIAL="000001"
