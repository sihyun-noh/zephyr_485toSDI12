# Configuration for using the ssd1306 oled display
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=128
CONFIG_CHARACTER_FRAMEBUFFER=y

#Configuration for using the RTC
CONFIG_COUNTER_MAXIM_DS3231=y
CONFIG_COUNTER=y

#Configuration for using led strip
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y


# #Configuration for using IPC
# CONFIG_IPC_SERVICE=y
# CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
# CONFIG_MBOX=y


#configuration for using Workqueue 
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=0
CONFIG_SYSTEM_WORKQUEUE_NO_YIELD=y

#새로은 라이브러리 추가
CONFIG_NEWLIB_LIBC=y
CONFIG_MINIMAL_LIBC=n

# POSIX 이름(poll/inet_pton)을 그대로 쓰려면:
